apiVersion: v1
kind: Namespace
metadata:
  name: a6-poc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: a6-data
  namespace: a6-poc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a6-app
  namespace: a6-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a6-app
  template:
    metadata:
      labels:
        app: a6-app
    spec:
      containers:
        - name: app
          image: a6-interference-poc-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: A6_DB_PATH
              value: /data/a6_runs.db
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: a6-data
---
apiVersion: v1
kind: Service
metadata:
  name: a6-app
  namespace: a6-poc
spec:
  selector:
    app: a6-app
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
