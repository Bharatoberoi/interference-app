openapi: 3.0.3
info: { title: Local HPSM Mock API, version: 0.1.0 }
servers: [{ url: http://localhost:8103 }]
paths:
  /incidents/prelog:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sector, change]
              properties:
                sector: {type: string}
                change: {type: string}
      responses: {'201': {description: Pre-log created}}
